<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Careers | Thrive Health</title>
<style>
    .job-card { display: flex; }
    .job-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.07); }
    .jobs-list { display: grid; }
</style>
</head>
<body>
<section class="section">
  <div class="container">
    <div class="jobs-intro">
      <div class="section-eyebrow">Come build with us</div>
      <h2 class="section-h2">Open Positions</h2>
    </div>
    <div class="jobs-list">

      <div class="job-card">
        <div class="job-info">
          <div class="job-title">Clinical Business Development Lead</div>
          <span class="job-tag"><span class="job-tag-dot"></span>Remote — Alberta</span>
        </div>
        <a href="careers/clinical-business-development-lead" class="job-btn">View role <svg aria-hidden="true" focusable="false" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
      </div>

      <div class="job-card">
        <div class="job-info">
          <div class="job-title">Registered Nurse, Virtual Care</div>
          <span class="job-tag"><span class="job-tag-dot"></span>Remote — Ontario</span>
        </div>
        <a href="careers/registered-nurse-virtual-care" class="job-btn">View role <svg aria-hidden="true" focusable="false" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
      </div>

    </div>

    <div class="ack-block">
      <p>Thrive Health is committed to privacy.</p>
    </div>
  </div>
</section>
</body>
</html>
