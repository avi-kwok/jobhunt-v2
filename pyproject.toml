[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobhunt"
version = "0.1.0"
description = "Personal CLI: scan first-party ATS boards for SWE internships and tailor resumes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jobhunt contributors" }]
dependencies = [
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
    "anthropic==1.17.0",
    "typer==0.15.1",
    "click==8.1.8",
    "rich==13.9.2",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=43",
    "fastapi==0.115.6",
    "jinja2==3.1.4",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
browser = ["playwright==1.47.0"]
dev = ["pytest==8.3.3", "respx==0.21.1"]

[project.scripts]
jobhunt = "jobhunt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunt"]
artifacts = ["src/jobhunt/data/*.tsv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
